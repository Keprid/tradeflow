services:
  - type: web
    name: tradeflow
    runtime: python
    plan: free
    buildCommand: >
      apt-get update -y &&
      (apt-get install -y fonts-liberation || true) &&
      pip install -r requirements.txt
    startCommand: uvicorn webapp.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
